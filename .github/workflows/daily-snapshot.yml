name: Daily EOD snapshot

# Builds a real price history over time, which the screen and every downstream
# repo consume. Runs on GitHub's infrastructure, so it does not depend on any
# machine being switched on.
#
# 12:20 UTC = 17:50 IST, comfortably after the NSE close at 15:30 IST.
on:
  schedule:
    - cron: "20 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install yfinance pandas

      - name: Fetch EOD bars
        run: python scripts/snapshot.py

      - name: Commit if anything changed
        run: |
          git config user.name "Achintya1311"
          git config user.email "67464985+Achintya1311@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --quiet; then
            echo "no new bars (holiday, or the feed returned nothing) - nothing to commit"
            exit 0
          fi
          git commit -m "data: EOD snapshot $(date -u +%Y-%m-%d)"
          git push
