# Screener rules. Edit this to change what gets screened for and how the
# three signal families are weighted — no code changes needed.
#
# `score` in the v1 contract is in [0, 1]; each signal below produces a
# [-1, 1] value that this file's weights blend, then (blend + 1) / 2 maps
# it into that range. Weights need not sum to 1 — they are normalised by
# their own total before blending.

weights:
  trend: 0.4
  momentum: 0.35
  volume: 0.25

trend:
  method: sma       # sma or ema
  fast: 20
  slow: 50

momentum:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9

volume:
  z_window: 20
  obv_window: 20

# Candidates are dropped before ranking if they fail either gate.
filters:
  min_adv_20d: 0        # 20-day average daily volume floor
  min_score: 0.0         # final blended score floor, in [0, 1]
