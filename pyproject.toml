[project]
name = "stockstalker"
version = "0.9.0"
description = "Front door to a nine-repo equity research pipeline, plus a small daily NSE screen. CLI only."
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "yfinance",
    "requests",
    "matplotlib",
    "rich",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stockstalker*"]
